[project]
name = "cricket-analytics"
version = "0.1.0"
description = "Modular cricket analytics platform — IPL, ICC, BCCI"
requires-python = ">=3.10"
dependencies = [
    # Core
    "pandas>=2.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",

    # Ingestion
    "requests>=2.31",
    "beautifulsoup4>=4.12",

    # Visualization
    "plotly>=5.18",
    "matplotlib>=3.8",
    "seaborn>=0.13",

    # Dashboard
    "streamlit>=1.30",

    # CLI
    "click>=8.1",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
]
nlp = [
    "spacy>=3.7",
    "nltk>=3.8",
]
scraping = [
    "scrapy>=2.11",
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]
all = ["cricket-analytics[ml,nlp,scraping,dev]"]

[project.scripts]
cricket = "src.cricket_analytics.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "ingestion*", "modules*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
