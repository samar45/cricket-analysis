[project]
name = "cricket-analytics"
version = "0.1.0"
description = "Cricket analytics over Cricsheet ball-by-ball data: DuckDB, a module registry, a CLI and a Streamlit dashboard"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "plotly>=5.18",
    "streamlit>=1.30",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]

[project.scripts]
cricket = "cricket_analytics.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "dashboard"]   # dashboard: so AppTest can `import ui`, as `streamlit run` does

[tool.setuptools.package-data]
cricket_analytics = ["reference/*.csv"]
